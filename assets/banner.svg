<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131a"/>
      <stop offset="55%" stop-color="#1a1c26"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7289fa"/>
      <stop offset="100%" stop-color="#4a54c9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865f2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5865f2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5865f2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- ambient dot grid -->
  <g fill="#5865f2" opacity="0.14">
    <circle cx="90"  cy="40"  r="2.5"/>
    <circle cx="150" cy="90"  r="2.5"/>
    <circle cx="60"  cy="150" r="2.5"/>
    <circle cx="180" cy="200" r="2.5"/>
    <circle cx="1080" cy="45"  r="2.5"/>
    <circle cx="1140" cy="100" r="2.5"/>
    <circle cx="1050" cy="170" r="2.5"/>
    <circle cx="1110" cy="230" r="2.5"/>
    <circle cx="1000" cy="60"  r="2.5"/>
  </g>

  <!-- accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  <rect x="0" y="277" width="1200" height="3" fill="url(#accent)"/>

  <!-- shield icon -->
  <g transform="translate(110,60) scale(1)" filter="url(#glow)">
    <path d="M80 0 L150 28 L150 92 C150 138 118 168 80 184 C42 168 10 138 10 92 L10 28 Z"
          fill="url(#shieldFill)" stroke="#c9cfff" stroke-width="2.5"/>
    <path d="M80 24 L128 43 L128 90 C128 122 106 145 80 156 C54 145 32 122 32 90 L32 43 Z"
          fill="#12131a" opacity="0.35"/>
    <path d="M56 92 L74 110 L108 66" fill="none" stroke="#ffffff" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title block -->
  <text x="330" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64"
        font-weight="700" fill="#ffffff">WnersGuard</text>
  <text x="332" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19"
        letter-spacing="3" fill="#9aa0ac">WNERSDEV SECURITY SYSTEMS</text>

  <!-- tagline -->
  <text x="332" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22"
        fill="#c7cbf5">Secure. &#160; Detect. &#160; Protect.</text>

  <!-- feature chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(332,222)">
      <rect width="108" height="30" rx="15" fill="#1f2130" stroke="#333650"/>
      <text x="54" y="20" text-anchor="middle" fill="#8fe3a3">🛡️ Anti-Nuke</text>
    </g>
    <g transform="translate(452,222)">
      <rect width="102" height="30" rx="15" fill="#1f2130" stroke="#333650"/>
      <text x="51" y="20" text-anchor="middle" fill="#8fe3a3">🚨 Anti-Raid</text>
    </g>
    <g transform="translate(566,222)">
      <rect width="150" height="30" rx="15" fill="#1f2130" stroke="#333650"/>
      <text x="75" y="20" text-anchor="middle" fill="#8fbfff">🌍 4 Languages</text>
    </g>
    <g transform="translate(728,222)">
      <rect width="150" height="30" rx="15" fill="#1f2130" stroke="#333650"/>
      <text x="75" y="20" text-anchor="middle" fill="#ffd479">🧠 Threat Engine</text>
    </g>
  </g>
</svg>
